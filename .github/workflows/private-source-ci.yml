name: Private Wallet Intelligence CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-wallet-intelligence-ci
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private source (ephemeral runner only)
        uses: actions/checkout@v4
        with:
          repository: Dejidanjuma/wallet-intelligence
          ref: feat/wallet-scan-profit-reconciliation
          token: ${{ secrets.WI_READONLY_TOKEN }}
          path: private-source
          persist-credentials: false
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and verify with sanitized diagnostics
        shell: bash
        run: |
          set -u
          cd private-source

          failures=0
          run_stage() {
            label="$1"
            shift
            if "$@" > /tmp/wi-ci-private.log 2>&1; then
              echo "$label: PASS"
            else
              code=$?
              echo "$label: FAIL (exit $code)"
              failures=$((failures + 1))
            fi
          }

          summarize_lint() {
            if [ -s /tmp/wi-lint.json ]; then
              node -e '
                const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/wi-lint.json","utf8").replace(/^\\uFEFF/,""));
                const a={errors:0,warnings:0,rules:{}};
                for(const f of d){a.errors+=f.errorCount||0;a.warnings+=f.warningCount||0;for(const m of f.messages||[])if(m.ruleId)a.rules[m.ruleId]=(a.rules[m.ruleId]||0)+1;}
                console.log("Lint summary:",JSON.stringify(a));
              '
            fi
          }

          summarize_tsc() {
            node -e '
              const fs=require("fs"),s=fs.readFileSync("/tmp/wi-ci-private.log","utf8");
              const codes={},files={};
              for(const m of s.matchAll(/([^\\s()]+\\.(?:ts|tsx|js|jsx))\\((\\d+),(\\d+)\\): error (TS\\d+):/g)){
                codes[m[4]]=(codes[m[4]]||0)+1;
                const base=m[1].split("/").pop(); files[base]=(files[base]||0)+1;
              }
              console.log("Typecheck summary:",JSON.stringify({diagnosticCount:Object.values(codes).reduce((a,b)=>a+b,0),codes,files:Object.entries(files).slice(0,15)}));
            '
          }

          summarize_tests() {
            if [ -s /tmp/wi-vitest.json ]; then
              node -e '
                const fs=require("fs"),d=JSON.parse(fs.readFileSync("/tmp/wi-vitest.json","utf8"));
                const files=d.testResults||[];let passed=0,failed=0,skipped=0;const failedTests=[];
                for(const f of files)for(const t of f.assertionResults||[]){
                  if(t.status==="passed")passed++;
                  else if(t.status==="failed"){failed++;failedTests.push({file:String(f.name||"").split("/").pop(),test:t.fullName||t.title||"unnamed"});}
                  else skipped++;
                }
                console.log("Vitest summary:",JSON.stringify({files:files.length,passed,failed,skipped,failedTests:failedTests.slice(0,10)}));
              '
            else
              echo "Vitest summary: JSON report unavailable; failure output withheld."
            fi
          }

          summarize_build() {
            node -e '
              const fs=require("fs"),s=fs.readFileSync("/tmp/wi-ci-private.log","utf8");
              const patterns=[/Module not found/g,/Cannot find module/g,/Type error/g,/Error occurred prerendering/g,/Failed to compile/g,/out of memory/gi];
              const counts={};for(const p of patterns){const m=s.match(p)||[];if(m.length)counts[p.source]=m.length;}
              const bases=[...s.matchAll(/(?:\\.\\/)?([^\\s/:]+\\.(?:ts|tsx|js|jsx|css))/g)].map(m=>m[1]).filter(x=>!x.startsWith("node_modules")).slice(0,10);
              console.log("Build summary:",JSON.stringify({errorMarkers:counts,referencedBasenames:[...new Set(bases)]}));
            '
          }

          run_stage "Lockfile regeneration" npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          run_stage "Dependency installation" npm ci --no-audit --no-fund

          if npm run lint -- --format json --output-file /tmp/wi-lint.json > /tmp/wi-ci-private.log 2>&1; then
            echo "Lint: PASS"
          else
            code=$?; echo "Lint: FAIL (exit $code)"; failures=$((failures + 1)); summarize_lint
          fi

          if npm run typecheck > /tmp/wi-ci-private.log 2>&1; then
            echo "Typecheck: PASS"
          else
            code=$?; echo "Typecheck: FAIL (exit $code)"; failures=$((failures + 1)); summarize_tsc
          fi

          if npm test -- --reporter=json --outputFile=/tmp/wi-vitest.json > /tmp/wi-ci-private.log 2>&1; then
            echo "Unit tests: PASS"
          else
            code=$?; echo "Unit tests: FAIL (exit $code)"; failures=$((failures + 1)); summarize_tests
          fi

          if npm run build > /tmp/wi-ci-private.log 2>&1; then
            echo "Production build: PASS"
          else
            code=$?; echo "Production build: FAIL (exit $code)"; failures=$((failures + 1)); summarize_build
          fi

          echo "Failed stages: $failures"
          rm -f /tmp/wi-ci-private.log /tmp/wi-lint.json /tmp/wi-vitest.json
          if [ "$failures" -gt 0 ]; then exit 1; fi

      - name: Export regenerated lockfile only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wi-regenerated-lockfile
          path: private-source/package-lock.json
          if-no-files-found: ignore
          retention-days: 1
