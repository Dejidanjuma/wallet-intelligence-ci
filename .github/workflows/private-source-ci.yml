name: Private Wallet Intelligence CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-wallet-intelligence-ci
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private source (ephemeral runner only)
        uses: actions/checkout@v4
        with:
          repository: Dejidanjuma/wallet-intelligence
          ref: feat/wallet-scan-profit-reconciliation
          token: ${{ secrets.WI_READONLY_TOKEN }}
          path: private-source
          persist-credentials: false
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and verify with sanitized diagnostics
        shell: bash
        run: |
          set -u
          cd private-source

          run_stage() {
            label="$1"
            shift
            if "$@" > /tmp/wi-ci-private.log 2>&1; then
              echo "$label: PASS"
            else
              code=$?
              echo "$label: FAIL (exit $code)"
              exit "$code"
            fi
          }

          run_stage "Lockfile regeneration" npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          run_stage "Dependency installation" npm ci --no-audit --no-fund

          if npm run lint -- --format json --output-file /tmp/wi-lint.json > /tmp/wi-ci-private.log 2>&1; then
            echo "Lint: PASS"
          else
            code=$?
            echo "Lint: FAIL (exit $code)"
            if [ -s /tmp/wi-lint.json ]; then
              node -e '
                const fs = require("fs");
                try {
                  const raw = fs.readFileSync("/tmp/wi-lint.json", "utf8").replace(/^\\uFEFF/, "");
                  const data = JSON.parse(raw);
                  const counts = data.reduce((a, f) => {
                    a.errors += f.errorCount || 0;
                    a.warnings += f.warningCount || 0;
                    a.fatal += f.fatalErrorCount || 0;
                    for (const m of f.messages || []) if (m.ruleId) a.rules[m.ruleId] = (a.rules[m.ruleId] || 0) + 1;
                    return a;
                  }, { errors: 0, warnings: 0, fatal: 0, rules: {} });
                  console.log("Lint summary:", JSON.stringify(counts));
                } catch {
                  console.log("Lint diagnostic: report exists but could not be parsed; private details withheld.");
                }
              '
            else
              echo "Lint diagnostic: ESLint did not create a JSON report; filtered startup details follow."
              grep -E '(^|[[:space:]])(ESLint:|Error:|TypeError:|ReferenceError:|SyntaxError:|ConfigError:|Cannot find|Could not|Failed to|A config object)' /tmp/wi-ci-private.log | head -n 4 | sed -E 's#\/home\/runner\/[^ ]+#<runner-path>#g; s#private-source\/[^ ]+#<private-path>#g' || true
            fi
            exit "$code"
          fi
          run_stage "Typecheck" npm run typecheck
          run_stage "Unit tests" npm test
          run_stage "Production build" npm run build
          rm -f /tmp/wi-ci-private.log /tmp/wi-lint.json
