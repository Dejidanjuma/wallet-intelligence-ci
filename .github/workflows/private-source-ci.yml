name: Private Wallet Intelligence CI

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact private Wallet Intelligence commit SHA to validate (optional)
        required: false
        type: string
  repository_dispatch:
    types: [wi-source-updated]

permissions:
  contents: read

concurrency:
  group: private-wallet-intelligence-ci
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private source (ephemeral runner only)
        uses: actions/checkout@v4
        with:
          repository: Dejidanjuma/wallet-intelligence
          ref: ${{ github.event.inputs.sha || github.event.client_payload.sha || 'feat/wallet-scan-profit-reconciliation' }}
          token: ${{ secrets.WI_READONLY_TOKEN }}
          path: private-source
          persist-credentials: false
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify without publishing private diagnostics
        shell: bash
        run: |
          set -u
          cd private-source
          failures=0

          run_stage() {
            label="$1"
            shift
            logfile="$(mktemp)"
            if "$@" >"$logfile" 2>&1; then
              echo "$label: PASS"
            else
              code=$?
              echo "$label: FAIL (exit $code)"
              failures=$((failures + 1))
            fi
            rm -f "$logfile"
          }

          # Lifecycle scripts are disabled to reduce install-time execution risk.
          run_stage "Dependency installation" npm ci --ignore-scripts --no-audit --no-fund
          run_stage "Dependency vulnerability audit" npm audit --audit-level=high
          run_stage "Lint" npm run lint
          run_stage "Typecheck" npm run typecheck
          run_stage "Unit tests" npm test -- --pool=forks --maxWorkers=1 --no-file-parallelism
          run_stage "Production build" npm run build

          echo "Failed stages: $failures"
          if [ "$failures" -gt 0 ]; then exit 1; fi
